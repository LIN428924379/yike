<script>
/* 尽早把主题定下来，免得浅色模式打开时先闪一下深色 */
(function () {
  var theme = "dark";
  try {
    var raw = localStorage.getItem("focus.state.v1");
    if (raw) {
      var saved = (JSON.parse(raw).settings || {}).theme || "dark";
      if (saved === "auto") {
        saved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
      }
      theme = saved === "light" ? "light" : "dark";
    }
  } catch (err) { /* 读不到就用深色 */ }
  document.documentElement.dataset.theme = theme;

  /* 安卓 App 里网页铺满全屏，系统栏高度用内边距让开。
     env(safe-area-inset-*) 在安卓 WebView 上不一定有值，所以给个兜底。 */
  var cap = window.Capacitor;
  var isNative = !!(cap && (cap.isNativePlatform
    ? cap.isNativePlatform()
    : (cap.platform && cap.platform !== "web")));
  /* --pad-top / --pad-bottom = 系统栏要占掉的高度（CSS 像素）。
     App 里先给个经验值，启动后再从原生那边问真实值；网页版默认 0。 */
  document.documentElement.style.setProperty("--pad-top", isNative ? "26px" : "0px");
  document.documentElement.style.setProperty("--pad-bottom", isNative ? "24px" : "0px");
  window.__dsNative = isNative;
})();
</script>
<!--
  单文件番茄钟 App：一个文件就是全部。
  不联网、不装东西、不需要后台程序，双击就能用。
  计划和记录都存在使用者自己的浏览器里，不上传任何地方。

  结构：底部两个 tab（任务 / 总结），默认停在「任务」。
        点任务 → 进入番茄钟页（开始 / 暂停 / 结束任务）。
-->
<style>
:root {
  /* 深色主题：冷深灰 + 亮珊瑚红（偏"科技感"那一路）。
     配色是在 6 套方案里挑出来的 —— 底色不偏暖，界面才不显浑。 */
  --bg: #0d0e12;
  --surface: #171921;
  --surface-2: #1e212b;
  --line: #272b36;
  --line-strong: #3a4050;
  --ink: #eceef4;          /* 不用纯白 —— 纯白压在深色上会发晕 */
  --muted: #8d93a3;
  --focus: #ff7a68;        /* 用在文字 / 圆环 / 图标上：亮一点才跳 */
  --focus-solid: #d63c31;  /* 用在实心按钮上：深一点，白字才够 4.5:1 */
  --break: #3ec49c;
  --danger: #f2555a;
  --track: #232733;
  --switch-off: #333a49;
  --tabbar-bg: #12141b;
  --bar-bg: linear-gradient(180deg, #12141b, rgba(18, 20, 27, .92));
  --toast-bg: #eceef4;
  --toast-ink: #12141b;
  --overlay: rgba(6, 8, 14, .66);
  --total-a: #3a1d1f;
  --total-b: #241719;
  --danger-line: #4a2a30;
  --danger-ink: #ff9a92;
  --bg-veil: none;         /* 没设背景图时不用这层；设了会在 [data-bg="on"] 里覆盖 */
  --radius: 16px;
  --tabbar: 62px;
}

/* ---------------- 浅色主题 ---------------- */
[data-theme="light"] {
  --bg: #f2f4f9;
  --surface: #ffffff;
  --surface-2: #f1f3f8;
  --line: #e4e8f0;
  --line-strong: #ccd3e0;
  --ink: #111827;
  --muted: #646b78;
  --focus: #d0342a;
  --focus-solid: #d0342a;   /* 浅色底上这个红本身就够深，两者可以一样 */
  --break: #0e9e70;
  --danger: #dc2626;
  --track: #e6eaf2;
  --switch-off: #ccd3e0;
  --tabbar-bg: #ffffff;
  --bar-bg: linear-gradient(180deg, #ffffff, rgba(255, 255, 255, .94));
  --toast-bg: #111827;
  --toast-ink: #ffffff;
  --overlay: rgba(17, 24, 39, .38);
  --total-a: #fff1ef;
  --total-b: #f4f6fb;
  --danger-line: #f2c8c4;
  --danger-ink: #b8291d;
  --bg-veil: none;         /* 同上，配合自定义背景图用 */
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  height: 100vh;
  overflow: hidden;
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
}
button, input { touch-action: manipulation; font: inherit; }
[hidden] { display: none !important; }

/* ---------------- 自定义背景图 ---------------- */
/* 这两层铺在最底下（在 HTML 里写在最前面），后面的内容自然盖在上面。
   刻意不写 z-index：一旦写了，谁上谁下就由 z-index 决定，容易把整个界面盖住。
   图是写在这层的 background-image 上的，不是给 body —— body 还要留给主题底色。 */
.app-bg, .app-veil {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
  background-repeat: no-repeat; background-position: center center; background-size: cover;
}
.app-veil { background-image: var(--bg-veil); }

/* 设了背景图时：页面底色透明、卡片变半透明 ——
   不然图只在卡片之间的缝里露一点点，等于白设。 */
[data-bg="on"] .screen { background: transparent; }
[data-bg="on"] {
  /* 注意：这里刻意【不】把 --bg 改成透明。
     body 的底色画在最底下的画布上，而背景图那一层是它前面的一个 fixed 元素，
     本来就盖得住它。留着这个底色，万一图加载失败也还能看，不会白屏。 */
  --surface: rgba(23, 25, 33, .74);
  --surface-2: rgba(30, 33, 43, .74);
  --line: rgba(255, 255, 255, .11);
  --line-strong: rgba(255, 255, 255, .20);
  --track: rgba(35, 39, 51, .74);
  --tabbar-bg: rgba(18, 20, 27, .82);
  --bar-bg: linear-gradient(180deg, rgba(18, 20, 27, .88), rgba(18, 20, 27, .72));
  --bg-veil: linear-gradient(180deg, rgba(13, 14, 18, .48), rgba(13, 14, 18, .74));
}
[data-theme="light"][data-bg="on"] {
  --surface: rgba(255, 255, 255, .80);
  --surface-2: rgba(241, 243, 248, .80);
  --line: rgba(17, 24, 39, .11);
  --line-strong: rgba(17, 24, 39, .20);
  --track: rgba(230, 234, 242, .80);
  --tabbar-bg: rgba(255, 255, 255, .86);
  --bar-bg: linear-gradient(180deg, rgba(255, 255, 255, .92), rgba(255, 255, 255, .78));
  --bg-veil: linear-gradient(180deg, rgba(242, 244, 249, .48), rgba(242, 244, 249, .74));
}
.bg-pick { display: flex; flex: 1; }
.bg-pick > * + * { margin-left: 10px; }
.bg-pick .btn { flex: 1; padding: 9px 10px; font-size: 13.5px; }

/* 备份用的文本框 */
.bk-text {
  width: 100%; height: 148px; padding: 10px 12px;
  color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 11px;
  font: 12.5px/1.5 monospace; resize: none; word-break: break-all;
}
.bk-text:focus { outline: none; border-color: var(--focus); }
.bk-hint { margin: 0 0 10px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }

/* 单个任务的时长设置（默认收起，不打扰"快速加一件事"） */
.per-toggle {
  width: 100%; margin-top: 12px; padding: 10px;
  border: 1px dashed var(--line-strong); border-radius: 11px;
  background: transparent; color: var(--muted);
  font: inherit; font-size: 13px; cursor: pointer;
}
.per-toggle:hover { color: var(--focus); border-color: var(--focus); }
.per-box {
  margin-top: 10px; padding: 12px;
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2);
}
.per-box .set-grid { gap: 10px; }



/* ---------------- 屏幕容器 ---------------- */
/* 注意：这里刻意不用 inset / min() / max() / aspect-ratio ——
   它们要 2019~2021 年的浏览器内核才认，老手机打开会整个散架。
   --pad-top / --pad-bottom 由 JS 按真实系统栏高度写入，拿不到就是 0。 */
.screen {
  position: fixed;
  top: 0; right: 0; left: 0;
  bottom: calc(var(--tabbar) + var(--pad-bottom, 0px));
  display: flex; flex-direction: column;
}
.screen.full { top: 0; right: 0; bottom: 0; left: 0; }   /* 计时页：全屏专注 */
.bar {
  flex: 0 0 auto;
  display: flex; align-items: center;
  padding: calc(14px + var(--pad-top, 0px)) 16px 10px;
  background: var(--bar-bg);
  border-bottom: 1px solid var(--line);
}
.bar > * + * { margin-left: 10px; }   /* 老内核不支持 flex 的 gap，用外边距代替 */
.bar h1 { margin: 0; font-size: 20px; font-weight: 750; flex: 1; }
.today-chip { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.bar-title {
  flex: 1; min-width: 0; text-align: center; font-size: 16px; font-weight: 650;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.round {
  width: 40px; height: 40px; flex: 0 0 auto;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
  font-size: 17px; cursor: pointer; line-height: 1;
}
.round:hover { border-color: var(--line-strong); }
.round.primary { background: var(--focus-solid); border-color: var(--focus-solid); color: #fff; font-size: 22px; }
.round.ghost { border-color: transparent; background: transparent; }
.bar-actions { display: flex; }
.bar-actions > * + * { margin-left: 8px; }

.body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 14px 16px calc(20px + var(--pad-bottom, 0px));
  -webkit-overflow-scrolling: touch;
}
.body.center {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-bottom: 26px;
}
.body.center > * + * { margin-top: 8px; }

/* ---------------- 任务清单 ---------------- */
.list { display: grid; gap: 10px; }
.task {
  display: flex; align-items: center;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px;
  cursor: pointer;
}
.task > * + * { margin-left: 12px; }
.task:hover { border-color: var(--line-strong); }
.task.done .name { text-decoration: line-through; color: var(--muted); }
.tick {
  width: 22px; height: 22px; flex: 0 0 auto; border-radius: 50%;
  border: 2px solid var(--line-strong); background: transparent; cursor: pointer; padding: 0;
}
.task.done .tick { background: var(--break); border-color: var(--break); }
.task-main { flex: 1; min-width: 0; }
.task .name { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task .meta { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.task .more {
  flex: 0 0 auto; border: 0; background: transparent; color: var(--muted);
  font-size: 20px; line-height: 1; padding: 4px 9px; border-radius: 9px; cursor: pointer;
}
.task .more:hover { background: var(--surface-2); color: var(--ink); }
.empty { color: var(--muted); text-align: center; padding: 56px 20px; margin: 0; font-size: 15px; line-height: 2; }

/* ---------------- 弹窗 ---------------- */
.modal {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40;
  background: var(--overlay);
  display: flex; align-items: center; justify-content: center;
  /* 键盘弹出时把卡片顶上去（全屏之后系统不再自动让位） */
  padding: 22px 22px calc(22px + var(--kb, 0px));
}
.modal-card {
  width: 100%; max-width: 380px; max-height: 88vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: 20px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
}
.modal-card h3 { margin: 0 0 14px; font-size: 17px; font-weight: 700; }
.modal-card input {
  width: 100%; padding: 12px 13px; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
}
.modal-card input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px rgba(255, 90, 77, .16); }
.modal-actions { display: flex; margin-top: 16px; }
.modal-actions > * + * { margin-left: 10px; }
.modal-actions .btn { flex: 1; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 12px; padding: 12px 18px; cursor: pointer;
  font-size: 15px; font-weight: 650;
}
.btn:hover { border-color: var(--line-strong); }
.btn:disabled { opacity: .35; cursor: default; }
.btn.primary { border: 0; background: var(--focus-solid); color: #fff; box-shadow: 0 8px 22px rgba(223, 68, 56, .34); }
.btn.danger { border-color: var(--danger-line); color: var(--danger-ink); }
.btn.danger:hover { border-color: var(--danger); color: #fff; background: rgba(255, 77, 77, .14); }
.btn.armed { border: 0; background: var(--danger); color: #fff; box-shadow: 0 8px 22px rgba(255, 77, 77, .38); }

/* ---------------- 计时页 ---------------- */
.ring {
  position: relative; margin: 6px auto 2px;
  width: 74vw; height: 74vw; max-width: 300px; max-height: 300px;
}
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { fill: none; stroke: var(--track); stroke-width: 14; }
.ring .bar { fill: none; stroke: var(--focus); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .3s; }
.ring.brk .bar { stroke: var(--break); }
.ring-center {
  position: absolute; top: 0; right: 0; bottom: 0; left: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.ring-center > * + * { margin-top: 2px; }
.clock { font-size: 54px; font-weight: 780; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.phase { font-size: 13.5px; font-weight: 650; color: var(--muted); }
.ring.foc .phase { color: var(--focus); }
.ring.brk .phase { color: var(--break); }
.pom-row { font-size: 13px; color: var(--muted); min-height: 20px; }
.controls3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 420px; margin-top: 14px; }

/* 只有"提醒不可用"时才会出现的一行警告（正常时隐藏，不占地方） */
.alarm-hint { font-size: 12.5px; color: var(--danger-ink); text-align: center; }

/* ---------------- 总结页 ---------------- */
.stats-bar { flex-wrap: wrap; }
.date-pick input[type="date"] {
  background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
  border-radius: 11px; padding: 7px 10px; font-size: 13.5px; font-weight: 650;
  cursor: pointer; font-family: inherit;
}
.date-pick input[type="date"]:focus { outline: none; border-color: var(--focus); }
.date-pick input[type="date"].active { border-color: var(--focus); color: var(--ink); }
.date-pick input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .6; cursor: pointer; }
[data-theme="light"] .date-pick input[type="date"]::-webkit-calendar-picker-indicator { filter: none; }

/* 主题选择行 */
.theme-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; font-size: 14.5px; border-top: 1px solid var(--line); flex-wrap: wrap;
}
.theme-row > * + * { margin-left: 10px; }
.theme-row .seg button { padding: 6px 11px; font-size: 13px; }

/* 本周 / 总计 两个按钮 */
.seg { display: flex; background: var(--surface-2); border-radius: 11px; padding: 4px; }
.seg > * + * { margin-left: 4px; }
.seg button {
  border: 0; background: transparent; color: var(--muted);
  border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 13.5px; font-weight: 650;
}
.seg button.on { background: var(--focus-solid); color: #fff; }
.chart-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
/* 扇形 / 条形 切换 */
.chart-head { display: flex; justify-content: flex-end; padding: 4px 2px 8px; }
.mini-seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.mini-seg button {
  padding: 5px 13px; border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: 12.5px; font-weight: 650; cursor: pointer;
}
.mini-seg button + button { border-left: 1px solid var(--line); }
.mini-seg button.on { background: var(--focus-solid); color: #fff; }
/* 条形图的底槽 */
.bar-track { fill: var(--surface-2); }
#pie { width: 100%; height: auto; display: block; }
#pie text { font-family: inherit; }
.slice-name { font-size: 12.5px; font-weight: 650; fill: var(--ink); }
.slice-time { font-size: 11.5px; fill: var(--muted); }
.leader { stroke: var(--line-strong); stroke-width: 1; }
.total-card {
  margin-top: 14px; padding: 16px; text-align: center;
  background: linear-gradient(135deg, var(--total-a), var(--total-b));
  border: 1px solid var(--line); border-radius: var(--radius);
}
.total-card .k { font-size: 13px; color: var(--muted); }
.total-card .v { font-size: 30px; font-weight: 780; font-variant-numeric: tabular-nums; margin-top: 2px; }
.total-card .sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

/* ---------------- 底部 tab ---------------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  height: calc(var(--tabbar) + var(--pad-bottom, 0px));
  padding-bottom: var(--pad-bottom, 0px);
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  background: var(--tabbar-bg); border-top: 1px solid var(--line);
}
.tabs button {
  border: 0; background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; font-size: 12.5px; font-weight: 650;
}
.tabs button > * + * { margin-top: 3px; }
/* 用 SVG 画图标，三个粗细一致才搭；换行时也不会像 emoji 那样忽大忽小 */
.tabs button .ico {
  width: 21px; height: 21px;
  stroke: currentColor; fill: none;
  stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
}
.tabs button.on { color: var(--focus); }

/* ---------------- 设置 ---------------- */
.set-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.set-item label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
.set-item input {
  width: 100%; padding: 10px 12px; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px;
}
.tools { display: flex; margin-top: 14px; }
.tools > * + * { margin-left: 10px; }
.tools .btn { flex: 1; padding: 11px 10px; font-size: 14px; }
.restore-row {
  margin-top: 12px; padding: 12px 13px;
  border: 1px dashed var(--line-strong); border-radius: 12px; background: rgba(53, 208, 165, .06);
}
.restore-row .restore-text { font-size: 13px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }

/* ---------------- 任务操作面板（点任务右边的⋯弹出） ---------------- */
.sheet-scrim {
  position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 55; background: var(--overlay);
  opacity: 0; pointer-events: none; transition: opacity .2s ease;
}
.sheet-scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(16px + var(--pad-bottom, 0px));
  box-shadow: 0 -12px 40px rgba(0, 0, 0, .32);
  transform: translateY(110%);
  transition: transform .22s ease;
  max-width: 560px; margin: 0 auto;
}
.sheet.open { transform: translateY(0); }
.sheet h4 {
  margin: 10px 0 14px; font-size: 14px; font-weight: 600; color: var(--muted);
  text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sheet .btn { width: 100%; margin-bottom: 9px; }
.sheet .btn:last-child { margin-bottom: 0; }

/* TIP-START 打赏（只给 App 版用，公开的网页版会自动删掉这一段） */
.tip-btn {
  width: 100%; margin-top: 12px; padding: 10px 0;
  border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: 13px; cursor: pointer;
}
.tip-btn:hover { color: var(--focus); }
.tip-card { text-align: center; }
.tip-card img {
  display: block; width: 100%; max-width: 290px; margin: 0 auto;
  border-radius: 14px; background: #fff;
}
.tip-card .hint { margin-top: 12px; }
/* TIP-END */

/* ---------------- 倒计时 ---------------- */
.cd-card {
  position: relative; overflow: hidden; min-height: 372px; border-radius: 22px;
  /* 边框和底色都用固定的（不跟主题走）：卡片上的字永远是白的，
     底色要是跟着浅色主题变浅，就变成"白字压浅底"，完全看不见 */
  border: 1px solid rgba(255, 255, 255, .09);
  background: linear-gradient(150deg, #343946, #171a21);
  display: flex; align-items: center; justify-content: center;
}
.cd-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
/* 图片上压一层暗色，不然白字压在亮照片上根本看不清 */
.cd-veil {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: linear-gradient(180deg, rgba(0, 0, 0, .42), rgba(0, 0, 0, .70));
}
.cd-inner { position: relative; z-index: 2; width: 100%; padding: 30px 22px; text-align: center; }
.cd-days { color: #fff; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.cd-days b { font-size: 74px; letter-spacing: -2px; }
.cd-days span { margin-left: 6px; font-size: 19px; font-weight: 650; }
.cd-days.small b { font-size: 40px; letter-spacing: 0; }
.cd-name { margin-top: 16px; font-size: 20px; font-weight: 750; color: #fff; }
.cd-date { margin-top: 7px; font-size: 13px; color: rgba(255, 255, 255, .72); }
.cd-quote {
  max-width: 290px; margin: 22px auto 0; padding-top: 18px;
  font-size: 14px; line-height: 1.75; color: rgba(255, 255, 255, .88);
  border-top: 1px solid rgba(255, 255, 255, .18);
}
.cd-dots { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
.cd-dots button {
  width: 8px; height: 8px; margin: 0 5px; padding: 0; border: 0; border-radius: 50%;
  background: var(--line-strong); cursor: pointer;
}
.cd-dots button.on { width: 20px; border-radius: 4px; background: var(--focus); }
.cd-actions { display: flex; margin-top: 16px; }
.cd-actions > * + * { margin-left: 10px; }
.cd-actions .btn { flex: 1; }

/* 倒计时弹窗（内容比其他弹窗长，要能滚） */
.modal-card.tall { max-height: 86vh; overflow-y: auto; }
.cd-label { display: block; margin: 15px 0 6px; font-size: 12.5px; color: var(--muted); }
.cd-label.top { margin-top: 0; }
.cd-pick { display: flex; }
.cd-pick > * + * { margin-left: 10px; }
.cd-pick .btn { flex: 1; padding: 10px; font-size: 13.5px; }
.cd-thumb { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cd-thumb img { display: block; width: 100%; max-height: 168px; object-fit: cover; }

/* ---------------- 提示 ---------------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar) + 18px); transform: translate(-50%, 16px);
  background: var(--toast-bg); color: var(--toast-ink); padding: 11px 18px; border-radius: 12px;
  font-size: 14px; font-weight: 650; box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
  opacity: 0; pointer-events: none; transition: .2s ease; max-width: 86vw; text-align: center; z-index: 50;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* 宽屏（电脑上打开）时把 App 收成手机宽度居中，别拉成一条 */
@media (min-width: 700px) {
  .screen, .tabs {
    width: 100%; max-width: 560px;
    left: 50%; right: auto;
    transform: translateX(-50%);
  }
  .screen.full { left: 50%; right: auto; }
}

/* 窄屏：顶栏要挤下「总结 + 今日/本周/总计 + 日期」，收一点 */
@media (max-width: 430px) {
  .stats-bar h1 { font-size: 17px; }
  .seg button { padding: 7px 9px; font-size: 12.5px; }
  .date-pick input[type="date"] { padding: 7px 7px; font-size: 12.5px; }
}
</style>
</head>
<body>

<!-- 自定义背景图：这两层铺在最底下，后面的内容自然盖在上面 -->
<div class="app-bg" id="app-bg" hidden></div>
<div class="app-veil" id="app-veil" hidden></div>

<!-- ==================== 任务 ==================== -->
<section class="screen" id="screen-tasks">
  <div class="bar">
    <h1>任务 <span class="today-chip" id="today-label"></span></h1>
    <div class="bar-actions">
      <button class="round" id="btn-settings" type="button" title="设置">⚙</button>
      <button class="round primary" id="btn-add" type="button" title="添加任务">＋</button>
    </div>
  </div>
  <div class="body">
    <div class="list" id="task-list"></div>
    <p class="empty" id="task-empty">
      还没有任务<br>点右上角的 <b>＋</b> 添加一件要做的事
    </p>
  </div>
</section>

<!-- ==================== 番茄钟 ==================== -->
<section class="screen full" id="screen-timer" hidden>
  <div class="bar">
    <button class="round ghost" id="btn-back" type="button" title="返回">←</button>
    <div class="bar-title" id="timer-task">任务</div>
    <span style="width:40px;flex:0 0 auto"></span>
  </div>
  <div class="body center">
    <div class="ring foc" id="ring">
      <svg viewBox="0 0 264 264" aria-hidden="true">
        <circle class="track" cx="132" cy="132" r="112"></circle>
        <circle class="bar" id="ring-bar" cx="132" cy="132" r="112"
                stroke-dasharray="703.7" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ring-center">
        <div class="clock" id="clock">25:00</div>
        <div class="phase" id="phase">准备开始</div>
      </div>
    </div>
    <div class="pom-row" id="pom-row"></div>
    <div class="alarm-hint" id="alarm-hint" hidden></div>

    <div class="controls3">
      <button class="btn primary" id="btn-start" type="button">开始</button>
      <button class="btn" id="btn-pause" type="button">暂停</button>
      <button class="btn danger" id="btn-finish" type="button">结束任务</button>
    </div>
  </div>
</section>

<!-- ==================== 总结 ==================== -->
<section class="screen" id="screen-stats" hidden>
  <div class="bar stats-bar">
    <h1>总结</h1>
    <div class="seg" id="stat-seg">
      <button type="button" data-mode="today">今日</button>
      <button type="button" data-mode="week">本周</button>
      <button type="button" data-mode="all">总计</button>
    </div>
    <label class="date-pick" title="选择某一天">
      <input type="date" id="stat-date">
    </label>
  </div>
  <div class="body">
    <div class="chart-wrap">
      <div class="chart-head">
        <div class="mini-seg" id="chart-seg">
          <button type="button" data-chart="pie">扇形</button>
          <button type="button" data-chart="bar">条形</button>
        </div>
      </div>
      <svg id="chart" viewBox="0 0 440 330"></svg>
    </div>
    <div class="total-card">
      <div class="k" id="grand-label">总和</div>
      <div class="v" id="grand-total">0 分钟</div>
      <div class="sub" id="grand-sub"></div>
    </div>
  </div>
</section>

<!-- ==================== 底部 tab ==================== -->
<nav class="tabs" id="tabs">
  <button type="button" data-screen="tasks" class="on">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>任务
  </button>
  <button type="button" data-screen="countdown">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3l8 18M16 3l-8 18"/></svg>倒计时
  </button>
  <button type="button" data-screen="stats">
    <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v8.5h8.5"/></svg>总结
  </button>
</nav>

<!-- ==================== 倒计时 ==================== -->
<section class="screen" id="screen-countdown" hidden>
  <div class="bar">
    <h1>倒计时</h1>
    <button class="round" id="cd-add" type="button" title="新建倒计时">＋</button>
  </div>
  <div class="body">
    <div id="cd-view">
      <div class="cd-card">
        <img class="cd-bg" id="cd-bg" alt="" hidden>
        <div class="cd-veil" id="cd-veil" hidden></div>
        <div class="cd-inner">
          <div class="cd-days" id="cd-days"><b id="cd-num">0</b><span id="cd-unit">天</span></div>
          <div class="cd-name" id="cd-name"></div>
          <div class="cd-date" id="cd-date"></div>
          <div class="cd-quote" id="cd-quote"></div>
        </div>
      </div>
      <div class="cd-dots" id="cd-dots"></div>
      <div class="cd-actions" id="cd-actions">
        <button class="btn" id="cd-edit" type="button">编辑</button>
        <button class="btn danger" id="cd-del" type="button">删除</button>
      </div>
    </div>
    <p class="empty" id="cd-empty">
      还没有倒计时<br>点右上角的 <b>＋</b> 加一个重要日子
    </p>
  </div>
</section>

<!-- ==================== 新建 / 编辑倒计时 ==================== -->
<div class="modal" id="modal-cd" hidden>
  <div class="modal-card tall">
    <h3 id="modal-cd-title">新建倒计时</h3>
    <label class="cd-label top" for="cd-name-input">事件名称</label>
    <input id="cd-name-input" placeholder="比如：考研上岸" maxlength="20" autocomplete="off">
    <label class="cd-label" for="cd-date-input">目标日期</label>
    <input type="date" id="cd-date-input">
    <label class="cd-label">背景图（可选）</label>
    <div class="cd-pick">
      <button class="btn" id="cd-pick" type="button">从相册选一张</button>
      <button class="btn" id="cd-drop" type="button" hidden>去掉图片</button>
    </div>
    <div class="cd-thumb" id="cd-thumb" hidden><img id="cd-thumb-img" alt=""></div>
    <input type="file" id="cd-file" accept="image/*" hidden>
    <label class="cd-label" for="cd-quote-input">专属文案（可选）</label>
    <input id="cd-quote-input" placeholder="留空 → 每天自动换一句" maxlength="40" autocomplete="off">
    <div class="modal-actions">
      <button class="btn" id="cd-cancel" type="button">取消</button>
      <button class="btn primary" id="cd-ok" type="button">保存</button>
    </div>
  </div>
</div>

<!-- ==================== 添加任务 ==================== -->
<div class="modal" id="modal-add" hidden>
  <div class="modal-card tall">
    <h3 id="modal-add-title">添加任务</h3>
    <input id="new-task-name" placeholder="比如：写周报" autocomplete="off">
    <button class="per-toggle" id="per-toggle" type="button">⏱ 单独设置这个任务的时长</button>
    <div class="per-box" id="per-box" hidden>
      <p class="bk-hint">留空就用「设置」里的默认值。比如背单词 15 分钟、写代码 45 分钟。</p>
      <div class="set-grid">
        <div class="set-item"><label>专注（分钟）</label><input type="number" id="per-focus" min="1" max="180" autocomplete="off"></div>
        <div class="set-item"><label>短休息（分钟）</label><input type="number" id="per-short" min="1" max="60" autocomplete="off"></div>
        <div class="set-item"><label>长休息（分钟）</label><input type="number" id="per-long" min="1" max="120" autocomplete="off"></div>
        <div class="set-item"><label>几轮后长休息</label><input type="number" id="per-rounds" min="1" max="12" autocomplete="off"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" id="add-cancel" type="button">取消</button>
      <button class="btn primary" id="add-ok" type="button">添加</button>
    </div>
  </div>
</div>

<!-- ==================== 导出备份 ==================== -->
<div class="modal" id="modal-export" hidden>
  <div class="modal-card tall">
    <h3>导出备份</h3>
    <p class="bk-hint" id="export-hint"></p>
    <textarea class="bk-text" id="export-text" readonly></textarea>
    <div class="modal-actions">
      <button class="btn" id="export-close" type="button">关闭</button>
      <button class="btn primary" id="export-copy" type="button">复制</button>
    </div>
  </div>
</div>

<!-- ==================== 导入备份 ==================== -->
<div class="modal" id="modal-import" hidden>
  <div class="modal-card tall">
    <h3>导入备份</h3>
    <p class="bk-hint">把之前导出的内容粘进来，或者选一个备份文件。<b>恢复会覆盖现在的数据</b>。</p>
    <textarea class="bk-text" id="import-text" placeholder="在这里粘贴备份内容…"></textarea>
    <div class="cd-pick" style="margin-top:10px">
      <button class="btn" id="import-pick" type="button">从文件选一个</button>
    </div>
    <input type="file" id="import-file" accept=".json,.txt,application/json,text/plain" hidden>
    <div class="modal-actions">
      <button class="btn" id="import-cancel" type="button">取消</button>
      <button class="btn danger" id="import-ok" type="button">恢复</button>
    </div>
  </div>
</div>

<!-- ==================== 设置 ==================== -->
<div class="modal" id="modal-settings" hidden>
  <div class="modal-card">
    <h3>设置</h3>
    <div class="set-grid">
      <div class="set-item"><label>专注时长（分钟）</label><input type="number" id="set-focus" min="1" max="180"></div>
      <div class="set-item"><label>短休息（分钟）</label><input type="number" id="set-short" min="1" max="60"></div>
      <div class="set-item"><label>长休息（分钟）</label><input type="number" id="set-long" min="1" max="120"></div>
      <div class="set-item"><label>几轮后长休息</label><input type="number" id="set-rounds" min="1" max="12"></div>
    </div>
    <p class="bk-hint" style="margin:10px 0 0">这里是<b>默认值</b>。某个任务想要不一样的时长（比如背单词短一点），在添加或编辑那个任务时单独设。</p>
    <div style="margin-top:10px">
      <div class="theme-row">
        <span>主题</span>
        <div class="seg" id="theme-seg">
          <button type="button" data-theme="dark">深色</button>
          <button type="button" data-theme="light">浅色</button>
          <button type="button" data-theme="auto">跟随系统</button>
        </div>
      </div>
      <div class="theme-row" style="margin-top:10px">
        <span>背景图</span>
        <div class="bg-pick">
          <button class="btn" id="bg-pick" type="button">选一张背景图</button>
          <button class="btn" id="bg-drop" type="button" hidden>去掉</button>
        </div>
      </div>
      <input type="file" id="bg-file" accept="image/*" hidden>
    </div>
    <div class="tools" style="margin-top:10px">
      <button class="btn" id="backup-export" type="button">导出备份</button>
      <button class="btn" id="backup-import" type="button">导入备份</button>
    </div>
    <div class="tools">
      <button class="btn" id="clear" type="button">清空全部记录</button>
    </div>
    <div class="restore-row" id="restore-row" hidden>
      <div class="restore-text" id="restore-text"></div>
      <button class="btn" id="restore" type="button" style="width:100%">恢复上次清空前的数据</button>
    </div>
    <!-- TIP-START -->
    <button class="tip-btn" id="tip-open" type="button">☕ 请作者喝杯咖啡</button>
    <!-- TIP-END -->
    <div class="modal-actions">
      <button class="btn primary" id="close-settings" type="button">完成</button>
    </div>
  </div>
</div>

<div class="sheet-scrim" id="sheet-scrim"></div>
<div class="sheet" id="task-sheet">
  <h4 id="sheet-title"></h4>
  <button class="btn" id="sheet-rename" type="button">编辑任务（名字 / 时长）</button>
  <button class="btn danger" id="sheet-delete" type="button">删除这个任务</button>
  <button class="btn" id="sheet-cancel" type="button">取消</button>

<script>
/* ===== PURE-LOGIC-START =====
   与界面无关的纯计算，tools/check_focus.mjs 会单独抽出这一段验证。
   不要在这里使用 document / localStorage 等浏览器专有对象。
   ===== */

const DEFAULT_SETTINGS = {
  focus: 25,          // 专注分钟
  short: 5,           // 短休息分钟
  long: 15,           // 长休息分钟
  rounds: 4,          // 几轮后长休息
  autoNext: true,     // 专注结束自动开始休息
  sound: true,        // 提示音（App 在前台时）
  vibrate: true,      // 到点震动
  alarm: true,        // 到点提醒：退到后台、甚至划掉 App 也会响
  theme: "light",     // dark=深色 / light=浅色 / auto=跟随系统（默认浅色）
  chart: "pie",       // 总结页用哪种图：pie=扇形 / bar=横向条形
};

const PHASE_LABEL = { focus: "专注中", short: "短休息", long: "长休息" };

/** 秒 -> "25:00" */
function formatClock(seconds) {
  const safe = Math.max(0, Math.round(seconds));
  const m = Math.floor(safe / 60);
  const s = safe % 60;
  return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}

/** 秒 -> "1 小时 25 分" / "25 分钟" / "不到 1 分钟" */
function formatDuration(seconds) {
  const safe = Math.max(0, Math.round(seconds));
  if (safe < 60) return "不到 1 分钟";
  const totalMinutes = Math.floor(safe / 60);
  const h = Math.floor(totalMinutes / 60);
  const m = totalMinutes % 60;
  if (h === 0) return m + " 分钟";
  if (m === 0) return h + " 小时";
  return h + " 小时 " + m + " 分";
}

/** 时间戳 -> 本地日期 "2026-10-03" */
function dayKey(timestamp) {
  const d = new Date(timestamp);
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

/** 从某天往前数 n 天，返回日期字符串数组（含当天，按时间正序） */
function lastNDays(n, fromTimestamp) {
  const base = new Date(fromTimestamp);
  base.setHours(0, 0, 0, 0);
  const days = [];
  for (let i = n - 1; i >= 0; i -= 1) {
    const d = new Date(base.getTime());
    d.setDate(d.getDate() - i);
    days.push(dayKey(d.getTime()));
  }
  return days;
}

/** 某个阶段该持续多少秒。
    任务自己单独设过就用它的，没设就用全局设置 —— 所以老任务不受影响。 */
function phaseSeconds(phase, settings, task) {
  const own = task && task.per ? Number(task.per[phase]) : 0;
  if (Number.isFinite(own) && own > 0) return Math.round(own) * 60;
  if (phase === "focus") return settings.focus * 60;
  if (phase === "long") return settings.long * 60;
  return settings.short * 60;
}

/** 几轮之后长休息：任务单独设过就用任务的 */
function roundsFor(settings, task) {
  const own = task && task.per ? Number(task.per.rounds) : 0;
  if (Number.isFinite(own) && own > 0) return Math.round(own);
  return settings.rounds;
}

/** 这一轮结束后，下一阶段是什么 */
function nextPhase(phase, focusRound, rounds) {
  if (phase !== "focus") return "focus";
  return focusRound % rounds === 0 ? "long" : "short";
}

/** 读一个任务自己设的时长。只留下合理范围内的正整数，别的（空、0、乱写的）都丢掉。 */
function readTaskPer(raw) {
  if (!raw || typeof raw !== "object") return null;
  const limits = { focus: 180, short: 60, long: 120, rounds: 12 };
  const per = {};
  Object.keys(limits).forEach(function (key) {
    const value = Number(raw[key]);
    if (Number.isFinite(value) && value >= 1) per[key] = Math.min(limits[key], Math.round(value));
  });
  return Object.keys(per).length > 0 ? per : null;
}

/** 某个范围的起始时间戳（today=今天零点 / week=本周一零点 / all=0） */
function rangeStart(range, now) {
  const d = new Date(now);
  d.setHours(0, 0, 0, 0);
  if (range === "today") return d.getTime();
  if (range === "week") {
    const back = (d.getDay() + 6) % 7;   // 周一算一周的开始
    d.setDate(d.getDate() - back);
    return d.getTime();
  }
  return 0;
}

/** 按范围筛选专注记录 */
function filterByRange(sessions, range, now) {
  const start = rangeStart(range, now);
  return sessions.filter((item) => item.start >= start);
}

/** 最早有记录的那一天，用来显示「从哪天开始」 */
function firstDay(sessions) {
  if (!sessions.length) return "";
  let earliest = sessions[0].start;
  for (const item of sessions) if (item.start < earliest) earliest = item.start;
  return dayKey(earliest);
}

/** 只保留某一天的专注记录 */
function filterByDay(sessions, day) {
  return sessions.filter((item) => dayKey(item.start) === day);
}

/** 某一天里，某个任务累计专注了多少秒 */
function taskSecondsOn(sessions, name, day) {
  return sessions.reduce(
    (sum, item) => (item.task === name && dayKey(item.start) === day ? sum + item.seconds : sum),
    0
  );
}

/** 按任务统计专注时长（秒），从多到少 */
function byTask(sessions) {
  const map = new Map();
  for (const item of sessions) {
    const key = item.task || "未命名";
    map.set(key, (map.get(key) || 0) + item.seconds);
  }
  return Array.from(map, ([name, seconds]) => ({ name, seconds }))
    .sort((a, b) => (b.seconds - a.seconds) || (a.name < b.name ? -1 : 1));
}

/** 按天统计专注时长（秒） */
function byDay(sessions) {
  const map = new Map();
  for (const item of sessions) {
    const key = dayKey(item.start);
    map.set(key, (map.get(key) || 0) + item.seconds);
  }
  return map;
}

/** 某一天的专注总秒数 */
function daySeconds(sessions, day) {
  return sessions.reduce((sum, item) => (dayKey(item.start) === day ? sum + item.seconds : sum), 0);
}

/** 某一天的番茄（专注段）个数 */
function dayCount(sessions, day) {
  return sessions.filter((item) => dayKey(item.start) === day).length;
}

/** 一批记录的总秒数 */
function totalSeconds(sessions) {
  return sessions.reduce((sum, item) => sum + item.seconds, 0);
}

/** 校验存档文件，返回整理好的状态；坏数据抛出中文错误 */
function readBackup(data) {
  if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("这不是一个数据文件");
  if (data.version !== 1) throw new Error("数据文件版本不对，读不了");
  const settings = Object.assign({}, DEFAULT_SETTINGS, data.settings || {});
  for (const key of ["focus", "short", "long", "rounds"]) {
    const value = Number(settings[key]);
    if (!Number.isFinite(value) || value <= 0) throw new Error("设置里的「" + key + "」不对");
    settings[key] = Math.round(value);
  }
  if (["dark", "light", "auto"].indexOf(settings.theme) === -1) settings.theme = "dark";
  if (["pie", "bar"].indexOf(settings.chart) === -1) settings.chart = "pie";
  const tasks = (Array.isArray(data.tasks) ? data.tasks : []).map((item, index) => {
    if (!item || typeof item !== "object") throw new Error("第 " + (index + 1) + " 个任务格式不对");
    const createdAt = Number(item.createdAt) || 0;
    const rawDay = String(item.day || "");
    const task = {
      id: String(item.id || ""),
      name: String(item.name || "").trim() || "未命名",
      done: !!item.done,
      pomodoros: Math.max(0, Math.round(Number(item.pomodoros) || 0)),
      createdAt: createdAt,
      // 任务归属哪一天；老数据没有 day 就按创建时间推算
      day: /^\d{4}-\d{2}-\d{2}$/.test(rawDay) ? rawDay : dayKey(createdAt || Date.now()),
    };
    // 单独的时长只在设过的时候才加上去，老数据保持原样
    const per = readTaskPer(item.per);
    if (per) task.per = per;
    return task;
  });
  const sessions = (Array.isArray(data.sessions) ? data.sessions : []).map((item, index) => {
    if (!item || typeof item !== "object") throw new Error("第 " + (index + 1) + " 条记录格式不对");
    const seconds = Number(item.seconds);
    const start = Number(item.start);
    if (!Number.isFinite(seconds) || seconds <= 0) throw new Error("第 " + (index + 1) + " 条记录的时长不对");
    if (!Number.isFinite(start) || start <= 0) throw new Error("第 " + (index + 1) + " 条记录的时间不对");
    return { id: String(item.id || ""), task: String(item.task || "未命名"), start: start, seconds: seconds };
  });
  // 倒计时：坏数据直接丢掉，不抛错 —— 不能因为一条坏记录让人丢掉全部数据
  const countdowns = (Array.isArray(data.countdowns) ? data.countdowns : [])
    .map((item) => {
      if (!item || typeof item !== "object") return null;
      const date = String(item.date || "");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return null;
      const name = String(item.name || "").trim().slice(0, 20);
      if (!name) return null;
      return {
        id: String(item.id || "") || ("cd" + Math.random().toString(36).slice(2, 9)),
        name: name,
        date: date,
        quote: String(item.quote || "").trim().slice(0, 40),
      };
    })
    .filter(Boolean);
  return { version: 1, settings: settings, tasks: tasks, sessions: sessions, countdowns: countdowns };
}

/** 把当前数据打包成存档格式（存在浏览器本地，同时用于校验版本） */
function buildBackup(state) {
  return JSON.stringify({
    version: 1,
    app: "一刻",
    savedAt: new Date().toISOString(),
    settings: state.settings,
    tasks: state.tasks,
    sessions: state.sessions,
    // 背景图不放在这里 —— 图片单独存在别的键下，免得每次保存都写几百 KB
    countdowns: state.countdowns,
  }, null, 2);
}

/**
 * "2026-10-05" → 从 1970-01-01 起的天数。
 * 用 UTC 算，避免时区把日期算偏一天。
 */
function dayNumber(dateKey) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateKey || ""));
  if (!m) return 0;
  return Math.floor(Date.UTC(Number(m[1]), Number(m[2]) - 1, Number(m[3])) / 86400000);
}

/** 距目标日期还有几天：今天=0，明天=1，已经过了=负数 */
function daysUntil(dateKey, nowTs) {
  const target = dayNumber(dateKey);
  if (!target) return 0;
  return target - dayNumber(dayKey(Number(nowTs) || Date.now()));
}

/** 今天显示哪一句：用户自己写了就用他的，没写才从池子里按天轮换 */
function pickQuote(custom, dateKey) {
  const own = String(custom == null ? "" : custom).trim();
  if (own) return own;
  return CD_QUOTES[Math.abs(dayNumber(dateKey)) % CD_QUOTES.length];
}

/** "2026-12-20" → "2026年12月20日" */
function formatCnDate(dateKey) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateKey || ""));
  if (!m) return "";
  return m[1] + "年" + Number(m[2]) + "月" + Number(m[3]) + "日";
}

/** 大数字上显示什么：还有 N 天 / 就是今天 / 已过去 N 天 */
function countdownLabel(days) {
  if (days > 0) return { text: String(days), unit: "天", small: false };
  if (days === 0) return { text: "就是今天", unit: "", small: true };
  return { text: "已过去 " + Math.abs(days), unit: "天", small: true };
}

/** 两个日期谁在前（倒计时列表按远近排，最近的在前） */
function byDateThenId(a, b) {
  if (a.date !== b.date) return a.date < b.date ? -1 : 1;
  return String(a.id) < String(b.id) ? -1 : 1;
}

/** 条形图每行的数据（纯计算，方便测试）。
    width 就是那条横杠的长度，最长的等于传入的 width 参数。 */
function barRows(parts, total, width) {
  return (parts || []).map(function (part) {
    const share = total > 0 ? part.seconds / total : 0;
    return {
      name: String(part.name),
      seconds: part.seconds,
      share: share,
      width: Math.round(share * width),
    };
  });
}

   这样切后台、锁屏、刷新回来，时间依然准确。 */
let timer = { phase: "focus", running: false, endAt: 0, remain: 0, round: 1 };

/* ---------------- 存取 ---------------- */
function save() {

    localStorage.setItem(KEY, buildBackup(state));

    state.settings = data.settings;
    state.tasks = data.tasks;
    state.sessions = data.sessions;
    state.countdowns = data.countdowns || [];
  } catch (err) { /* 坏了就从空开始，不阻塞使用 */ }

function saveTimer() {
  try {
    localStorage.setItem(KEY_TIMER, JSON.stringify({
      phase: timer.phase, running: timer.running, endAt: timer.endAt,
      remain: timer.remain, taskId: currentTaskId, round: timer.round,
    }));
  } catch (err) { /* 忽略 */ }
}

/** true=继续跑；"expired"=离开期间已走完；false=没有进行中的计时 */
function loadTimer() {
  let saved;
  try {
    const raw = localStorage.getItem(KEY_TIMER);
    if (!raw) return false;
    saved = JSON.parse(raw);
  } catch (err) { return false; }
  if (!saved || typeof saved !== "object") return false;

  timer.phase = saved.phase === "short" || saved.phase === "long" ? saved.phase : "focus";
  timer.round = Number(saved.round) || 1;
  timer.remain = Number(saved.remain) || phaseSeconds(timer.phase, state.settings, currentTask());
  timer.running = false;
  if (saved.taskId && state.tasks.some((t) => t.id === saved.taskId)) currentTaskId = saved.taskId;

  const endAt = Number(saved.endAt);
  if (saved.running && Number.isFinite(endAt)) {
    timer.endAt = endAt;
    if (endAt > Date.now()) { timer.running = true; return true; }
    timer.remain = 0;
    return "expired";
  }
  return false;
}

/**
 * 把相册里的照片压小：长边最多 1080 像素，转成 JPEG。
 * 不压的话一张手机照片就 2~5MB，而本地存储总共才 5MB 左右，存一张就爆。
 */
function compressPhoto(file) {
  return new Promise(function (resolve, reject) {
    function finish(source, width, height) {
      try {
        const scale = Math.min(1, CD_IMG_MAX / Math.max(width, height));
        const w = Math.max(1, Math.round(width * scale));
        const h = Math.max(1, Math.round(height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(source, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", CD_IMG_QUALITY));
      } catch (err) {
        reject(new Error("这张图处理不了，换一张试试"));
      }
    }

    function byImg() {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        finish(img, img.naturalWidth, img.naturalHeight);
        URL.revokeObjectURL(url);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("这张图读不了，换一张试试"));
      };
      img.src = url;
    }

    // 新内核可以用这个顺便把竖拍照片按 EXIF 摆正
    if (window.createImageBitmap) {
      createImageBitmap(file, { imageOrientation: "from-image" })
        .then(function (bitmap) { finish(bitmap, bitmap.width, bitmap.height); })
        .catch(function () {
          createImageBitmap(file)
            .then(function (bitmap) { finish(bitmap, bitmap.width, bitmap.height); })
            .catch(byImg);
        });
      return;
    }
    byImg();
  });
}

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(box.value).then(function () {
      toast("已复制，找地方存好");
    }).catch(fallback);
  } else {
    fallback();
  }
}

/* ---------------- 计时器 ---------------- */
function setPhase(phase) {
  timer.phase = phase;
  timer.remain = phaseSeconds(phase, state.settings, currentTask());
}

function startTimer() {
  if (timer.running) return;
  if (!currentTask()) { toast("先选一个任务"); return; }
  if (timer.remain <= 0) timer.remain = phaseSeconds(timer.phase, state.settings, currentTask());
  timer.running = true;
  timer.endAt = Date.now() + timer.remain * 1000;
  if (state.settings.alarm) askNotify();
  scheduleAlarm(timer.phase, timer.remain);
  clearInterval(ticking);
  ticking = setInterval(tick, 250);
  saveTimer();
  drawTimer();
}

function pauseTimer() {
  if (!timer.running) return;
  timer.remain = currentSeconds();
  timer.running = false;
  cancelAlarm();
  clearInterval(ticking);
  ticking = null;
  saveTimer();
  drawTimer();
}

/** 一段（专注或休息）自然走完 */
/** 到点震动（前台靠自己震；退到后台靠系统通知里配的震动） */
function vibrate(pattern) {
  if (!state.settings.vibrate) return;
  try {
    if (navigator.vibrate) navigator.vibrate(pattern || [180, 90, 180]);
  } catch (err) { /* 设备不支持就算了 */ }
}

function completePhase() {
  // 注意：这里**不能**取消原生闹钟 —— 系统通知正是这一刻要弹出来的，
  // 取消了就只剩前台那声微弱的网页提示音，也不会有震动。
  clearInterval(ticking);
  ticking = null;
  timer.running = false;

  const finished = timer.phase;
  const task = currentTask();
  if (finished === "focus") {
    // 记的这一段时长要用"这个任务的专注时长"，不然统计会偏
    const focused = phaseSeconds("focus", state.settings, task);
    state.sessions.push({
      id: newId(),
      task: task ? task.name : "未命名",
      start: Date.now() - focused * 1000,
      seconds: focused,
    });
    if (task) task.pomodoros += 1;
    save();
  }

  // 原生闹钟已经排上了的话，声音和震动交给系统通知（更响、还会震），这里不再重复
  if (!alarmArmed) {
    beep(finished === "focus" ? 2 : 1);
    vibrate(finished === "focus" ? [200, 100, 200] : [140, 80, 140]);
  }
  notify(
    finished === "focus" ? "专注结束，休息一下 ☕" : "休息结束，继续专注 🍅",
    finished === "focus" ? "这一轮完成了，起来动动。" : "回来吧，下一个番茄开始了。"
  );

  const next = nextPhase(finished, timer.round, roundsFor(state.settings, task));
  if (finished !== "focus") timer.round += 1;
  setPhase(next);
  drawTimer();

  // 到点就按设置走：自动开始下一段。
  // （之前在后台到点时不自动开始，是我自作聪明 —— 正常番茄钟就该自动接着走。）
  if (state.settings.autoNext) {
    toast(finished === "focus" ? "这一轮完成，开始休息" : "休息结束，继续专注");
    startTimer();
  } else {
    toast(finished === "focus" ? "这一轮完成，点开始进入休息" : "休息结束，点开始继续");
    saveTimer();
  }
}

function tick() {
  drawTimer();
  if (currentSeconds() <= 0) completePhase();
}

/** 结束任务：把已经专注的时间记下来，回到任务列表 */
function finishTask() {
  const total = phaseSeconds(timer.phase, state.settings, currentTask());
  const elapsed = Math.max(0, total - currentSeconds());
  const task = currentTask();

  if (timer.phase === "focus" && task && elapsed >= 60) {
    state.sessions.push({
      id: newId(), task: task.name,
      start: Date.now() - elapsed * 1000, seconds: Math.round(elapsed),
    });
    save();
    toast("已记录 " + formatDuration(elapsed) + " 到「" + task.name + "」");
  } else {
    toast("已结束");
  }

  clearInterval(ticking);
  ticking = null;
  timer.running = false;
  timer.round = 1;
  cancelAlarm();
  setPhase("focus");
  saveTimer();
  backToList();
}

/* ---------------- 提示音 & 通知 ---------------- */
let audioCtx = null;
function beep(times) {
  if (!state.settings.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    for (let i = 0; i < times; i += 1) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const at = now + i * 0.42;
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, at);
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.35, at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.34);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(at);
      osc.stop(at + 0.36);
    }
  } catch (err) { /* 没有音频权限就算了 */ }
}

function askNotify() {
  if (!("Notification" in window)) return;
  if (Notification.permission === "default") Notification.requestPermission();
}

function notify(title, body) {
  if (!state.settings.alarm) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification(title, { body: body, tag: "focus" }); } catch (err) { /* 忽略 */ }
}

/* ---------------- 后台提醒（原生闹钟） ----------------
   App 一退到后台，安卓就会冻结网页，setInterval 不再跑，
   所以"时间到了没提示音"。解决办法不是让网页别被冻结（做不到），
   而是在开始计时的时候，直接往安卓系统里排一个闹钟 ——
   App 退到后台、甚至被划掉，时间到了系统照样响铃、弹通知。 */
const ALARM_ID_FOCUS = 9001;
const ALARM_ID_BREAK = 9003;
/* 通道 id 后面那个 v2 是必须的：铃声和震动模式挂在通道上，
   而通道一旦建好，系统就不允许再改设置 —— 想换只能换一个新 id。
   试过两次换新 id（v3）：两次都是"通知就不响了"，所以退回 v2 不再动它。
   通知能响 > 震动长一点，这个取舍很明确。 */
const ALARM_CHANNEL = "focus-alarm-v2";

/** 专注结束和休息结束用两个不同的 id：换阶段时才不会把刚弹出来的那条顺手抹掉 */
function alarmIdFor(phase) {
  return phase === "focus" ? ALARM_ID_FOCUS : ALARM_ID_BREAK;
}

/** 原生闹钟排上了没 —— 排上了的话，声音和震动就交给系统通知 */
let alarmArmed = false;
/** 提醒这条路通不通（权限给了 + 通道建好了）。计时页上会显示，省得靠猜。 */
let alarmReady = false;

function nativeAlerts() {
  const plugins = window.Capacitor && window.Capacitor.Plugins;
  return (plugins && plugins.LocalNotifications) || null;
}

/** 我们自己写的原生插件（见 ShellPlugin.java） */
function nativeShell() {
  const plugins = window.Capacitor && window.Capacitor.Plugins;
  return (plugins && plugins.Shell) || null;
}

/** 只有提醒真的出问题时才提示；一切正常就藏起来，计时页保持干净 */
function drawAlarmHint() {
  const el = $("alarm-hint");
  if (!el) return;
  const broken = window.__dsNative && state.settings.alarm && !alarmReady;
  el.textContent = broken ? "⚠ 通知权限没开，退到后台不会响" : "";
  el.hidden = !broken;
}

/**
 * 把提醒这条路准备好：要通知权限 + 让原生那边建好通知通道。
 *
 * 为什么要放到原生建通道：安卓的**铃声和震动模式挂在通道上**，
 * 通知插件给不了自定义的震动节奏，铃声也只能填 res/raw 里的文件名。
 * 具体实现在 ShellPlugin.java 的 prepareAlarm 里。
 *
 * 时机很重要：这一步会弹系统权限对话框，所以必须在**用户开始计时之前**做完。
 * 否则用户点了「开始」马上切到别的 App，对话框卡在那儿，闹钟就排不上了 ✗
 */
/**
 * 两个"系统层"的授权，一次只弹一个 —— 同时弹两个系统页面会互相顶掉 ✗。
 * 优先级：允许后台耗电（实测就是这个卡住的）> 精确闹钟。
 * 都开过之后就不再打扰。
 */
async function ensureSystemPermissions() {
  const ln = nativeAlerts();
  const shell = nativeShell();
  if (!ln) return;

  // ① 允许后台耗电：小米、华为这类系统，不开它，App 被清掉之后系统就不再叫醒它了 ——
  //    权限全给了、闹钟也排了，到点就是不响。系统会直接弹一个对话框，点「允许」就行。
  if (!batteryChecked && shell && shell.requestBackgroundPower) {
    batteryChecked = true;
    try {
      const res = await shell.requestBackgroundPower();
      if (res && res.opened) {
        toast("请点「允许」—— 不然退到后台、或者手机忙起来的时候，到点可能不提醒");
        return;   // 一次只弹一个系统页面
      }
    } catch (err) { /* 打不开就算了，不打扰 */ }
  }

  // ② 精确闹钟：安卓 12 起要单独授权，不授权的话闹钟可以被系统随意推迟、合并
  if (!exactAlarmChecked && typeof ln.checkExactNotificationSetting === "function") {
    exactAlarmChecked = true;
    try {
      const res = await ln.checkExactNotificationSetting();
      const value = String((res && (res.exact_alarm || res.exactAlarm)) || res || "");
      if (value.indexOf("granted") >= 0 || value.indexOf("true") >= 0) return;
      if (typeof ln.changeExactNotificationSetting === "function") {
        await ln.changeExactNotificationSetting();
        toast("请把「闹钟和提醒」打开 —— 不开的话，熄屏或手机忙的时候提醒会被系统推迟");
      }
    } catch (err) {
      // 打不开就算了，不打扰
    }
  }
}

async function ensureAlarmReady() {
  const ln = nativeAlerts();
  if (!ln) return false;
  try {
    const perm = await ln.checkPermissions();
    if (perm.display !== "granted") await ln.requestPermissions();

    let channelOk = true;
    const shell = nativeShell();
    if (shell && shell.prepareAlarm) {
      const res = await shell.prepareAlarm();
      // 通道没建成功的话，通知会被系统【静默丢掉】—— 用户什么都看不到。
      // 所以这一步的结果必须看住，不能当没发生。
      if (res && res.ok === false) {
        channelOk = false;
        if (!channelWarned) {
          channelWarned = true;
          toast("提醒通道没建起来，退到后台可能不会响");
        }
      }
    }

    alarmReady = (await alarmPermissionGranted()) && channelOk;
    // 精确闹钟单独检查：它决定"手机忙的时候、熄屏的时候"能不能准时响
    ensureSystemPermissions();
  } catch (err) {
    alarmReady = false;
  }
  drawAlarmHint();
  return alarmReady;
}

/** 通知权限到底给了没 —— 没给的话后台到点会被系统静默丢掉 */
async function alarmPermissionGranted() {
  const ln = nativeAlerts();
  if (!ln) return false;
  try {
    const perm = await ln.checkPermissions();
    return perm.display === "granted";
  } catch (err) { return false; }
}

let alarmPermissionWarned = false;
let channelWarned = false;
let scheduleWarned = false;
let exactAlarmChecked = false;
let batteryChecked = false;

async function scheduleAlarm(phase, seconds) {
  const ln = nativeAlerts();
  if (!ln || !state.settings.alarm) return;
  if (!seconds || seconds <= 0) return;

  try {
    await ln.cancel({ notifications: [{ id: alarmIdFor(phase) }] }).catch(() => {});

    const result = await ln.schedule({
      notifications: [{
        id: alarmIdFor(phase),
        title: phase === "focus" ? "专注结束 ☕" : "休息结束 🍅",
        body: phase === "focus" ? "这一轮完成了，起来动动。" : "回来吧，下一个番茄开始了。",
        channelId: ALARM_CHANNEL,
        // 不传 sound：安卓 8+ 的铃声由通道决定，
        // 通道那边用的是我们自己打包的 pomodoro.wav（3.6 秒、音量拉满）
        schedule: { at: new Date(Date.now() + seconds * 1000), allowWhileIdle: true },
      }],
    });
    alarmArmed = true;

    if (!alarmReady && !alarmPermissionWarned) {
      alarmPermissionWarned = true;
      toast("通知权限没开，退到后台不会响 —— 去手机设置里打开");
    }
    if (result && result.warning) toast("系统没允许精确闹钟，提醒可能晚几分钟");
  } catch (err) {
    alarmArmed = false;
    // 排不上要说出来 —— 之前这里是默默吞掉的，所以"后台不响"一直查不出原因
    if (!scheduleWarned) {
      scheduleWarned = true;
      toast("闹钟没排上，退到后台可能不会响（" + (err && err.message ? err.message : "未知原因") + "）");
    }
  }
  drawAlarmHint();
}

async function cancelAlarm() {
  alarmArmed = false;
  drawAlarmHint();
  const ln = nativeAlerts();
  if (!ln) return;
  try {
    await ln.cancel({ notifications: [{ id: ALARM_ID_FOCUS }, { id: ALARM_ID_BREAK }] });
  } catch (err) { /* 忽略 */ }
}

/* ---------------- 画：任务列表 ---------------- */
function drawTasks() {
  const box = $("task-list");
  box.textContent = "";
  const todayTasks = state.tasks.filter((task) => task.day === activeDay);
  $("task-empty").hidden = todayTasks.length > 0;
  $("today-label").textContent = activeDay;

  todayTasks.forEach((task) => {
    const row = document.createElement("div");
    row.className = "task" + (task.done ? " done" : "");
    row.title = "点一下，进入番茄钟";

    const tick = document.createElement("button");
    tick.type = "button";
    tick.className = "tick";
    tick.title = task.done ? "标记为未完成" : "标记为完成";
    tick.addEventListener("click", (event) => {
      event.stopPropagation();
      task.done = !task.done;
      save();
      drawTasks();
    });

    const main = document.createElement("div");
    main.className = "task-main";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = task.name;
    const meta = document.createElement("div");
    meta.className = "meta";
    const spent = taskSecondsToday(task.name);
    // 这个任务单独设过时长的话，标出来 —— 不然用户会奇怪为什么倒计时不一样
    const own = task.per && task.per.focus ? " · ⏱ " + task.per.focus + " 分钟/番茄" : "";
    meta.textContent = (task.pomodoros ? "🍅 " + task.pomodoros + " · " : "") +
      (spent ? "共专注 " + formatDuration(spent) : "还没开始") + own;
    main.append(name, meta);

    const more = document.createElement("button");
    more.type = "button";
    more.className = "more";
    more.textContent = "⋯";
    more.title = "改名字 / 删除";
    more.addEventListener("click", (event) => {
      event.stopPropagation();
      openSheet(task);
    });

    row.append(tick, main, more);
    row.addEventListener("click", () => enterTimer(task));
    box.appendChild(row);
  });
}

/* ---------------- 画：番茄钟 ---------------- */
function drawTimer() {
  const total = phaseSeconds(timer.phase, state.settings, currentTask());
  const left = Math.max(0, Math.min(total, currentSeconds()));
  const ratio = total > 0 ? left / total : 0;
  const task = currentTask();

  $("clock").textContent = formatClock(left);
  $("ring-bar").setAttribute("stroke-dashoffset", String(RING_LENGTH * (1 - ratio)));
  $("ring").className = "ring " + (timer.phase === "focus" ? "foc" : "brk");
  $("phase").textContent = timer.running
    ? PHASE_LABEL[timer.phase]
    : (left === total ? "准备开始" : "已暂停");
  $("timer-task").textContent = task ? task.name : "任务";
  $("pom-row").textContent = task && task.pomodoros ? "🍅 已完成 " + task.pomodoros + " 个番茄" : "";

  $("btn-start").disabled = timer.running;
  $("btn-pause").disabled = !timer.running;
  document.title = (timer.running ? formatClock(left) + " · " : "") + "一刻";
  drawAlarmHint();
}

/* ---------------- 画：总结扇形图 ---------------- */
/** 总结页当前看的是哪一段 */
function statsSessions() {
  const now = Date.now();
  if (statMode === "all") {
    const from = firstDay(state.sessions);
    return {
      list: state.sessions,
      label: from ? "总计 · 从 " + from + " 起" : "总计",
      empty: "还没有任何专注记录",
    };
  }
  if (statMode === "week") {
    const from = rangeStart("week", now);
    return {
      list: filterByRange(state.sessions, "week", now),
      label: "本周 " + dayLabel(from) + " - " + dayLabel(from + 6 * 86400000),
      empty: "本周还没有专注记录",
    };
  }
  const today = dayKey(Date.now());
  return {
    list: filterByDay(state.sessions, selectedDay),
    label: selectedDay === today ? "今日" : selectedDay,
    empty: selectedDay === today ? "今天还没有专注记录" : "这天还没有专注记录",
  };
}

function drawStats() {
  const picked = statsSessions();
  const sessions = picked.list;
  const parts = byTask(sessions);
  const total = totalSeconds(sessions);

  const today = dayKey(Date.now());
  const isToday = statMode === "day" && selectedDay === today;

  $("stat-date").value = selectedDay;
  // 「今日」按钮亮着时不用再强调日历；用日历选了别的日子才高亮日历框
  $("stat-date").classList.toggle("active", statMode === "day" && !isToday);
  document.querySelectorAll("#stat-seg button").forEach((btn) => {
    const mode = btn.dataset.mode;
    const on = (mode === "today" && isToday) ||
               (mode === "week" && statMode === "week") ||
               (mode === "all" && statMode === "all");
    btn.classList.toggle("on", on);
  });
  $("grand-label").textContent =
    statMode === "all" ? "全部专注总和"
      : statMode === "week" ? "本周专注总和"
        : (isToday ? "今日专注总和" : "这天专注总和");

  document.querySelectorAll("#chart-seg button").forEach((btn) => {
    btn.classList.toggle("on", btn.dataset.chart === chartType());
  });

  const svg = $("chart");
  svg.textContent = "";

  if (!parts.length || total <= 0) {
    svg.setAttribute("viewBox", "0 0 440 330");
    const text = document.createElementNS(NS, "text");
    text.setAttribute("x", "220");
    text.setAttribute("y", "165");
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("class", "slice-time");
    text.setAttribute("font-size", "15");
    text.textContent = picked.empty;
    svg.appendChild(text);
  } else if (chartType() === "bar") {
    drawBars(svg, parts, total);
  } else {
    svg.setAttribute("viewBox", "0 0 440 330");
    const cx = 220, cy = 165, R = 86;
    let angle = -Math.PI / 2;   // 从 12 点开始顺时针画

    parts.forEach((part, index) => {
      const color = SLICE_COLORS[index % SLICE_COLORS.length];
      const sweep = (part.seconds / total) * Math.PI * 2;
      const a0 = angle;
      const a1 = angle + sweep;
      angle = a1;

      const path = document.createElementNS(NS, "path");
      if (parts.length === 1) {
        // 只有一项时画整圆（弧线起终点相同是画不出来的）
        path.setAttribute("d", "M " + cx + " " + (cy - R) +
          " A " + R + " " + R + " 0 1 1 " + (cx - 0.01) + " " + (cy - R) + " Z");
      } else {
        const x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
        const x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
        const large = sweep > Math.PI ? 1 : 0;
        path.setAttribute("d", "M " + cx + " " + cy +
          " L " + x0.toFixed(2) + " " + y0.toFixed(2) +
          " A " + R + " " + R + " 0 " + large + " 1 " + x1.toFixed(2) + " " + y1.toFixed(2) + " Z");
      }
      path.setAttribute("fill", color);
      path.setAttribute("stroke", "#171a21");
      path.setAttribute("stroke-width", "2");
      svg.appendChild(path);

      // 引线 + 标签：任务名一行，专注时长一行
      const mid = (a0 + a1) / 2;
      const onRight = Math.cos(mid) >= 0;
      const lx = cx + (R + 12) * Math.cos(mid);
      const ly = cy + (R + 12) * Math.sin(mid);
      const tx = cx + (R + 34) * Math.cos(mid);
      const ty = cy + (R + 34) * Math.sin(mid);

      const leader = document.createElementNS(NS, "line");
      leader.setAttribute("x1", (cx + (R + 1) * Math.cos(mid)).toFixed(2));
      leader.setAttribute("y1", (cy + (R + 1) * Math.sin(mid)).toFixed(2));
      leader.setAttribute("x2", lx.toFixed(2));
      leader.setAttribute("y2", ly.toFixed(2));
      leader.setAttribute("class", "leader");
      svg.appendChild(leader);

      const anchor = onRight ? "start" : "end";
      const nameText = document.createElementNS(NS, "text");
      nameText.setAttribute("x", tx.toFixed(2));
      nameText.setAttribute("y", (ty - 2).toFixed(2));
      nameText.setAttribute("text-anchor", anchor);
      nameText.setAttribute("class", "slice-name");
      nameText.textContent = trimName(part.name);
      svg.appendChild(nameText);

      const timeText = document.createElementNS(NS, "text");
      timeText.setAttribute("x", tx.toFixed(2));
      timeText.setAttribute("y", (ty + 14).toFixed(2));
      timeText.setAttribute("text-anchor", anchor);
      timeText.setAttribute("class", "slice-time");
      timeText.textContent = formatDuration(part.seconds) +
        " · " + Math.round((part.seconds / total) * 100) + "%";
      svg.appendChild(timeText);
    });
  }

  $("grand-total").textContent = formatDuration(total);
  $("grand-sub").textContent = picked.label + " · " + parts.length + " 个任务 · " + sessions.length + " 个番茄";
}

/** 总结页现在用哪种图 */
function chartType() {
  return state.settings.chart === "bar" ? "bar" : "pie";
}

/**
 * 横向条形图：一个任务一行，条的长短就是它占的比例。
 * 行高固定，所以任务多了图就变高（viewBox 跟着变）。
 */
function drawBars(svg, parts, total) {
  const W = 440;
  const top = 12;
  const rowH = 50;
  const textY = 13;
  const barY = 23;
  const barH = 14;
  const height = top * 2 + parts.length * rowH;
  svg.setAttribute("viewBox", "0 0 " + W + " " + height);

  barRows(parts, total, W).forEach(function (row, index) {
    const y = top + index * rowH;

    const name = document.createElementNS(NS, "text");
    name.setAttribute("x", "2");
    name.setAttribute("y", String(y + textY));
    name.setAttribute("class", "slice-name");
    name.textContent = row.name.length > 12 ? row.name.slice(0, 11) + "…" : row.name;
    svg.appendChild(name);

    const meta = document.createElementNS(NS, "text");
    meta.setAttribute("x", String(W - 2));
    meta.setAttribute("y", String(y + textY));
    meta.setAttribute("text-anchor", "end");
    meta.setAttribute("class", "slice-time");
    meta.textContent = formatDuration(row.seconds) + " · " + Math.round(row.share * 100) + "%";
    svg.appendChild(meta);

    const track = document.createElementNS(NS, "rect");
    track.setAttribute("x", "2");
    track.setAttribute("y", String(y + barY));
    track.setAttribute("width", String(W - 4));
    track.setAttribute("height", String(barH));
    track.setAttribute("rx", String(barH / 2));
    track.setAttribute("class", "bar-track");
    svg.appendChild(track);

    const fill = document.createElementNS(NS, "rect");
    fill.setAttribute("x", "2");
    fill.setAttribute("y", String(y + barY));
    // 至少给一个圆头的宽度，占比再小也看得见
    fill.setAttribute("width", String(Math.max(barH, row.width)));
    fill.setAttribute("height", String(barH));
    fill.setAttribute("rx", String(barH / 2));
    fill.setAttribute("fill", SLICE_COLORS[index % SLICE_COLORS.length]);
    svg.appendChild(fill);
  });
}

function dayLabel(timestamp) {
  return dayKey(timestamp).slice(5).replace("-", "/");
}

function trimName(name) {
  return name.length > 8 ? name.slice(0, 7) + "…" : name;
}

/* ---------------- 主题 ---------------- */
function resolvedTheme() {
  const choice = state.settings.theme || "dark";
  if (choice === "auto") {
    const light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
    return light ? "light" : "dark";
  }
  return choice === "light" ? "light" : "dark";
}

/** 让原生那边跟着主题走：窗口底色 + 状态栏图标颜色（没装原生壳就自动跳过） */
function syncShell(theme) {
  try {
    const plugins = window.Capacitor && window.Capacitor.Plugins;
    const shell = plugins && plugins.Shell;
    if (shell && shell.theme) shell.theme({ light: theme === "light" });
  } catch (err) { /* 忽略 */ }
}

function applyTheme() {
  const theme = resolvedTheme();
  document.documentElement.dataset.theme = theme;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "light" ? "#FFFFFF" : "#171A21");
  syncShell(theme);
}

/* ---------------- 画：设置 ---------------- */
function drawSettings() {
  const s = state.settings;
  $("set-focus").value = s.focus;
  $("set-short").value = s.short;
  $("set-long").value = s.long;
  $("set-rounds").value = s.rounds;
  document.querySelectorAll("#theme-seg button").forEach((btn) => {
    btn.classList.toggle("on", btn.dataset.theme === (s.theme || "dark"));
  });
}

/* ---------------- 进入 / 离开番茄钟 ---------------- */
function enterTimer(task) {
  const sameTask = currentTaskId === task.id;
  currentTaskId = task.id;

  // 只有"同一个任务、而且计时正在跑"才接着用。
  // 其余情况（换了任务 / 计时已经停了 / 上回是休息阶段没跑）都回到专注开头，
  // 否则会出现"点进来还停在上一轮的状态、按开始也没反应"。
  if (!sameTask || !timer.running) {
    setPhase("focus");
    timer.round = 1;
    saveTimer();
  }

  showScreen("timer");
  drawTimer();
  // 进计时页时确认一下提醒这条路通不通（权限可能刚被系统重置）
  ensureAlarmReady();
}

function backToList() {
  showScreen("tasks");
}

function openSheet(task) {

$("sheet-delete").addEventListener("click", () => {

let editingTask = null;

/** 输入框里的浅色提示 = 现在设置里的默认值 */
function fillPerDefaults() {
  const s = state.settings;
  $("per-focus").placeholder = String(s.focus);
  $("per-short").placeholder = String(s.short);
  $("per-long").placeholder = String(s.long);

}

/** 打开弹窗时：把任务已有的时长填回去；没设过就收起来 */
function resetPerBox(task) {
  fillPerDefaults();
  const per = (task && task.per) || {};
  $("per-focus").value = per.focus ? String(per.focus) : "";
  $("per-short").value = per.short ? String(per.short) : "";
  $("per-long").value = per.long ? String(per.long) : "";

/** 读输入框里的时长。交给纯逻辑校验范围，乱填的会被丢掉。 */
function readPerInputs() {
  return readTaskPer({
    focus: Number($("per-focus").value),
    short: Number($("per-short").value),
    long: Number($("per-long").value),
    rounds: Number($("per-rounds").value),
  });

function openAdd() {
  editingTask = null;
  $("modal-add-title").textContent = "添加任务";
  $("add-ok").textContent = "添加";
  $("new-task-name").value = "";
  resetPerBox(null);
  $("modal-add").hidden = false;
  setTimeout(() => $("new-task-name").focus(), 30);
}

function openRename(task) {
  editingTask = task;
  $("modal-add-title").textContent = "编辑任务";
  $("add-ok").textContent = "保存";
  $("new-task-name").value = task.name;
  resetPerBox(task);
  $("modal-add").hidden = false;
  setTimeout(() => {
    const input = $("new-task-name");
    input.focus();
    input.select();
  }, 30);
}

function confirmAdd() {
  const name = ($("new-task-name").value || "").trim();
  if (!name) { toast("先写一件事吧"); return; }
  const per = readPerInputs();

  if (editingTask) {
    const oldName = editingTask.name;
    const day = editingTask.day;
    editingTask.name = name;
    if (per) editingTask.per = per; else delete editingTask.per;
    // 专注记录里存的是任务名，改名时一起改，免得总结里冒出两个名字
    state.sessions.forEach((item) => {
      if (item.task === oldName && dayKey(item.start) === day) item.task = name;
    });
    save();
    $("modal-add").hidden = true;
    editingTask = null;
    drawTasks();
    toast("已保存「" + name + "」");
    return;
  }

  const task = { id: newId(), name: name, done: false, pomodoros: 0, createdAt: Date.now(), day: activeDay };
  if (per) task.per = per;
  state.tasks.unshift(task);
  save();
  $("modal-add").hidden = true;
  drawTasks();
  toast(per ? "已添加：" + name + "（" + per.focus + " 分钟/番茄）" : "已添加：" + name);
}

/* 开关都撤掉了：这几个行为固定用默认值（都是开着的）。

/* --- 清空数据：两次点击 + 一次书面确认，防止误触 --- */
const KEY_BACKUP = "focus.backup.v1";
let clearArmed = false;
let clearCountdown = null;

/** 清空前先悄悄存一份，万一后悔还能捞回来 */
function snapshotBeforeClear() {
  try {
    localStorage.setItem(KEY_BACKUP, JSON.stringify({
      at: Date.now(),
      data: { version: 1, settings: state.settings, tasks: state.tasks, sessions: state.sessions },
    }));
  } catch (err) { /* 忽略 */ }
}

function readSnapshot() {
  try {
    const raw = localStorage.getItem(KEY_BACKUP);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.data) return null;
    return { at: Number(parsed.at) || 0, data: readBackup(parsed.data) };
  } catch (err) { return null; }
}

function drawRestoreRow() {
  const snap = readSnapshot();
  const row = $("restore-row");
  const empty = !snap || (!snap.data.tasks.length && !snap.data.sessions.length);
  row.hidden = empty;
  if (!empty) {
    $("restore-text").textContent = "上次清空前的数据还留着：" +
      snap.data.tasks.length + " 个任务、" + snap.data.sessions.length + " 条专注记录。";
  }
}

function disarmClear() {
  clearArmed = false;
  clearInterval(clearCountdown);
  clearCountdown = null;
  const btn = $("clear");
  btn.classList.remove("armed");
  btn.textContent = "清空全部记录";
}

$("clear").addEventListener("click", () => {
  const btn = $("clear");

  // 第一次点：只是「待确认」，5 秒内不再点就自动取消
  if (!clearArmed) {
    clearArmed = true;
    btn.classList.add("armed");
    let left = 5;
    btn.textContent = "再点一次确认清空（" + left + "）";
    clearInterval(clearCountdown);
    clearCountdown = setInterval(() => {
      left -= 1;
      if (left <= 0) { disarmClear(); return; }
      btn.textContent = "再点一次确认清空（" + left + "）";
    }, 1000);
    return;
  }

  // 第二次点：最后再问一遍，把后果说清楚
  disarmClear();
  const ok = confirm(
    "最后确认：要清空全部数据吗？\n\n" +
    "任务 " + state.tasks.length + " 个、专注记录 " + state.sessions.length + " 条\n\n" +
    "⚠️ 清空后无法恢复，也没有备份文件可以还原。"
  );
  if (!ok) { toast("已取消"); return; }

  snapshotBeforeClear();
  state.tasks = [];
  state.sessions = [];
  currentTaskId = null;
  save();
  drawTasks();
  drawStats();
  drawRestoreRow();
  toast("已清空（清空前留了一份，可在设置里恢复）");
});

$("restore").addEventListener("click", () => {
  const snap = readSnapshot();
  if (!snap) { toast("没有可恢复的数据"); return; }
  if (!confirm("用上次清空前的数据覆盖现在的内容？")) return;
  state.settings = snap.data.settings;
  state.tasks = snap.data.tasks;
  state.sessions = snap.data.sessions;
  currentTaskId = null;
  save();
  drawTasks();
  drawStats();
  drawSettings();
  drawRestoreRow();
  toast("已恢复 " + snap.data.tasks.length + " 个任务、" + snap.data.sessions.length + " 条记录");
});

/* ---------------- 全屏与系统栏 ---------------- */
/** 读一条 CSS 长度 —— 用来问一句：浏览器到底知不知道安全区有多高？ */
function readCssLength(css) {
  const probe = document.createElement("div");
  probe.style.cssText = "position:fixed;top:0;left:0;width:0;height:0;padding-top:" + css;
  document.body.appendChild(probe);
  const value = parseFloat(getComputedStyle(probe).paddingTop) || 0;
  probe.remove();
  return value;
}

/** 系统栏高度：App 里问原生要真实值；网页版测 CSS 的 env()（iPhone 会用到） */
async function refineInsets() {
  if (window.__dsNative) {
    try {
      const plugins = window.Capacitor && window.Capacitor.Plugins;
      const shell = plugins && plugins.Shell;
      if (shell && shell.insets) {
        const info = await shell.insets();
        const top = Math.round((info && info.top) || 0);
        const bottom = Math.round((info && info.bottom) || 0);
        if (top > 0) document.documentElement.style.setProperty("--pad-top", top + "px");
        if (bottom > 0) document.documentElement.style.setProperty("--pad-bottom", bottom + "px");
      }
    } catch (err) { /* 拿不到就保留兜底值 */ }
    return;
  }

  // 网页版：读得到安全区（比如 iPhone 的刘海）就用真实值
  const top = readCssLength("env(safe-area-inset-top, 0px)");
  const bottom = readCssLength("env(safe-area-inset-bottom, 0px)");
  if (top > 0) document.documentElement.style.setProperty("--pad-top", top + "px");
  if (bottom > 0) document.documentElement.style.setProperty("--pad-bottom", bottom + "px");
}

/* 键盘弹出时把弹窗顶上去，别被挡住（铺满全屏之后系统不再自动让位） */
if (window.visualViewport) {
  const syncKeyboard = () => {
    const gap = Math.max(0, Math.round(window.innerHeight - window.visualViewport.height));
    document.documentElement.style.setProperty("--kb", gap + "px");
  };
  window.visualViewport.addEventListener("resize", syncKeyboard);
  syncKeyboard();
}

/* ---------------- 启动 ---------------- */
load();

/* 默认主题从「跟随系统」改成了「浅色」。
   老用户本地存的是 auto，不迁一下的话打开还是黑的，看不出变化。
   只迁一次；之后用户自己改成什么都尊重。 */
try {
  if (!localStorage.getItem("focus.theme.migrated.v1")) {
    localStorage.setItem("focus.theme.migrated.v1", "1");
    if (state.settings.theme === "auto") {
      state.settings.theme = "light";
      save();
    }
  }
} catch (err) { /* 隐私模式等，忽略 */ }

applyTheme();
refineInsets();

/* 提前把通知权限和通道准备好：免得用户"点完开始就切后台"，
   权限对话框还卡在半路，闹钟压根没排上 */
if (state.settings.alarm) ensureAlarmReady();
activeDay = dayKey(Date.now());
selectedDay = activeDay;
const resumed = loadTimer();
if (resumed === "expired") {
  // 离开期间这一段已经走完：结算掉，但不要自动开启下一段
  const keepAuto = state.settings.autoNext;
  state.settings.autoNext = false;
  completePhase();
  state.settings.autoNext = keepAuto;
  setPhase(timer.phase);
} else if (resumed === true) {
  ticking = setInterval(tick, 250);
  toast("接着上次继续");
} else {
  setPhase("focus");
}
showScreen("tasks");
drawTimer();
drawSettings();
wireCountdown();
wireAppBg();
wireBackup();
saveTimer();
</script>
</body>
</html>
